name: Karnataka HC Cause List Monitor

on:
  schedule:
    # Runs every 10 minutes on weekdays (Mon-Fri).
    - cron: "*/10 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cause-list-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install System Dependencies (WeasyPrint support)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            python3-cffi \
            libcairo2 \
            libpango-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Cause List Monitor
        env:
          DAYS_AHEAD: "7"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM: ${{ secrets.SENDGRID_FROM }}
          SENDGRID_TO: ${{ secrets.SENDGRID_TO }}
        run: python monitor.py

      - name: Upload Cause List Artifacts (PDF & Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cause-list-results
          path: |
            results/*.pdf
            results/*.xlsx
            results/*.csv
            results/*.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit & Push Results
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            git commit -m "auto: update latest cause list matches and PDF report"
            git push origin HEAD:main
          fi
